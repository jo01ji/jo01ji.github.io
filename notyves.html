<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>notYves</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{
  --bg:#f7f6f3; --panel:#ffffff; --ink:#1b1a18; --ink2:#5d5b56; --ink3:#8d8a84; --line:#e3e1dc;
  --accent:#2f5d8a; --accent-ink:#ffffff; --me:#e9eef5; --warn:#9a3b1f; --ok:#2e7d4f;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace; --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141414; --panel:#1d1d1c; --ink:#ecebe8; --ink2:#a9a7a2; --ink3:#77756f; --line:#2f2f2d;
  --accent:#7fb0e0; --accent-ink:#0f1720; --me:#22303d; --warn:#f0936d; --ok:#7fcf9f;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);
  position:sticky;top:0;z-index:2;padding-top:max(10px,env(safe-area-inset-top))}
header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
header .sub{color:var(--ink3);font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ink3);flex:none}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--warn)}
header .sp{flex:1}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 11px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
main{flex:1;overflow-y:auto;padding:16px 16px 8px}
.wrap{max-width:760px;margin:0 auto}
.msg{margin:0 0 14px}
.msg.me{background:var(--me);border-radius:12px;padding:9px 13px;margin-left:12%;white-space:pre-wrap}
.msg.ny{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.msg.ny .who,.msg.me .who{font-size:12px;color:var(--ink3);margin-bottom:2px;white-space:normal}
.msg.ny p{margin:.5em 0} .msg.ny ul,.msg.ny ol{padding-left:1.3em;margin:.4em 0}
.msg.ny h1,.msg.ny h2,.msg.ny h3{font-size:16px;margin:.9em 0 .3em}
.msg.ny code{font-family:var(--mono);font-size:.9em;background:var(--bg);padding:1px 4px;border-radius:4px}
.msg.ny pre{background:var(--bg);padding:10px;border-radius:8px;overflow-x:auto}
.msg.ny pre code{padding:0;background:none}
.msg.ny table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%;font-size:14px}
.msg.ny td,.msg.ny th{border:1px solid var(--line);padding:4px 7px;text-align:left;vertical-align:top}
.msg.ny blockquote{margin:.5em 0;padding-left:10px;border-left:3px solid var(--line);color:var(--ink2)}
.msg.ny a{color:var(--accent)}
.status{font-size:13px;color:var(--ink3);margin:2px 0 0}
.err{color:var(--warn)}
.empty{color:var(--ink2);text-align:center;margin-top:12vh}
.empty h2{font-size:20px;margin:0 0 6px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.chips button{font-size:14px;color:var(--ink2);border-radius:999px}
footer{border-top:1px solid var(--line);background:var(--panel);padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
form{display:flex;gap:8px;max-width:760px;margin:0 auto;align-items:flex-end}
textarea{flex:1;font:inherit;resize:none;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg);
  color:var(--ink);max-height:40vh;min-height:44px}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:-1px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);width:min(520px,calc(100% - 32px));padding:18px}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h2{margin:0 0 10px;font-size:17px}
label{display:block;font-size:14px;color:var(--ink2);margin:12px 0 4px}
input{width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--ink)}
.hint{font-size:13px;color:var(--ink3);margin-top:8px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot" title="server status"></span>
  <div><h1>notYves</h1><div class="sub" id="sub">visiting-professor advisor</div></div>
  <span class="sp"></span>
  <button id="newBtn" title="Start a new conversation">New</button>
  <button id="setBtn" title="Settings" aria-label="Settings">⚙︎</button>
</header>

<main id="main"><div class="wrap" id="log"></div></main>

<footer>
  <form id="form">
    <textarea id="q" rows="1" placeholder="Ask notYves…" autocomplete="off"></textarea>
    <button class="primary" id="send" type="submit">Send</button>
  </form>
</footer>

<dialog id="settings">
  <h2>Connect to your Mac</h2>
  <label for="url">Server address (Tailscale)</label>
  <input id="url" placeholder="https://your-mac.tailnet-name.ts.net" inputmode="url" autocapitalize="off" spellcheck="false">
  <label for="key">Key</label>
  <input id="key" type="password" placeholder="from server/token.txt on the Mac" autocapitalize="off" spellcheck="false">
  <p class="hint">Stored only in this browser. The page holds no data; answers come from your Mac and are visible only to
    devices on your Tailscale network.</p>
  <div class="row"><button id="cancel" type="button">Cancel</button><button class="primary" id="save" type="button">Save</button></div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem("notyves." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("notyves." + k, JSON.stringify(v)); } catch {} },
};
let cfg = store.get("cfg", { url: "", key: "" });
let convo = store.get("convo", { session: "", messages: [] });   // this device only
let busy = false;

const md = s => DOMPurify.sanitize(marked.parse(s || ""));
const EXAMPLES = [
  "Generate a meaningful research question for 2026, given our equipment and computing.",
  "What sets the Widmanstätten-start temperature in Fe–C–Mn, and how would I test it in situ?",
  "Which experiment best separates PLE from NPLE ferrite growth with our facilities?",
];

function render() {
  const log = $("log");
  log.innerHTML = "";
  if (!convo.messages.length) {
    log.innerHTML = `<div class="empty"><h2>Ask for advice</h2>
      <div>Research questions, experiment design, what a result means.<br>Answers cite your library with page numbers.</div>
      <div class="chips">${EXAMPLES.map((e, i) => `<button data-i="${i}">${e}</button>`).join("")}</div></div>`;
    log.querySelectorAll(".chips button").forEach(b => b.onclick = () => { $("q").value = EXAMPLES[b.dataset.i]; grow(); $("q").focus(); });
    return;
  }
  for (const m of convo.messages) log.appendChild(bubble(m));
  scrollDown();
}
function bubble(m) {
  const d = document.createElement("div");
  d.className = "msg " + (m.role === "user" ? "me" : "ny");
  if (m.role === "user") { d.textContent = m.text; }
  else { d.innerHTML = `<div class="who">notYves</div><div class="body">${md(m.text)}</div>` +
           (m.error ? `<div class="status err">${escapeHtml(m.error)}</div>` : ""); }
  return d;
}
const escapeHtml = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const scrollDown = () => { const m = $("main"); m.scrollTop = m.scrollHeight; };
const save = () => store.set("convo", convo);

function grow() { const t = $("q"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, innerHeight * 0.4) + "px"; }

async function health() {
  const dot = $("dot");
  if (!cfg.url || !cfg.key) { dot.className = "dot bad"; $("sub").textContent = "not connected: open settings"; return; }
  try {
    const r = await fetch(cfg.url.replace(/\/$/, "") + "/health", { headers: { Authorization: "Bearer " + cfg.key } });
    const j = await r.json();
    dot.className = r.ok ? "dot ok" : "dot bad";
    $("sub").textContent = r.ok ? (j.busy ? "connected · busy" : "connected") : (j.error || "error");
  } catch { dot.className = "dot bad"; $("sub").textContent = "Mac not reachable (Tailscale on? server running?)"; }
}

const TOOL_LABEL = { Read: "reading a file", Grep: "searching files", Glob: "looking for files", Bash: "running a search or calculation",
  WebSearch: "searching the web", WebFetch: "reading a web page", Skill: "loading the notYves method", Edit: "writing the log",
  Write: "writing the log", TodoWrite: "planning" };

async function ask(question) {
  if (busy || !question.trim()) return;
  if (!cfg.url || !cfg.key) { openSettings(); return; }
  busy = true; $("send").disabled = true;
  convo.messages.push({ role: "user", text: question });
  const reply = { role: "ny", text: "" };
  convo.messages.push(reply);
  render();
  const el = $("log").lastChild, body = el.querySelector(".body");
  const status = document.createElement("div"); status.className = "status"; status.textContent = "thinking…"; el.appendChild(status);
  const t0 = Date.now();
  const tick = setInterval(() => { status.dataset.t = Math.round((Date.now() - t0) / 1000); status.textContent = (status.dataset.what || "thinking") + "… " + status.dataset.t + " s"; }, 1000);
  try {
    const r = await fetch(cfg.url.replace(/\/$/, "") + "/ask", {
      method: "POST", headers: { Authorization: "Bearer " + cfg.key, "Content-Type": "application/json" },
      body: JSON.stringify({ question, session: convo.session }),
    });
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || ("HTTP " + r.status)); }
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl); buf = buf.slice(nl + 1);
        if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.type === "session") { convo.session = ev.session; }
        else if (ev.type === "text") { reply.text += ev.text; body.innerHTML = md(reply.text); status.dataset.what = "writing"; scrollDown(); }
        else if (ev.type === "tool") { status.dataset.what = TOOL_LABEL[ev.name] || ("using " + ev.name); if (reply.text && !reply.text.endsWith("\n\n")) reply.text += "\n\n"; }
        else if (ev.type === "done") { convo.session = ev.session || convo.session; }
        else if (ev.type === "error") { throw new Error(ev.error); }
      }
    }
  } catch (e) {
    reply.error = "Error: " + e.message;
  } finally {
    clearInterval(tick); busy = false; $("send").disabled = false;
    save(); render(); health();
  }
}

function openSettings() { $("url").value = cfg.url; $("key").value = cfg.key; $("settings").showModal(); }
$("setBtn").onclick = openSettings;
$("cancel").onclick = () => $("settings").close();
$("save").onclick = () => { cfg = { url: $("url").value.trim(), key: $("key").value.trim() }; store.set("cfg", cfg); $("settings").close(); health(); };
$("newBtn").onclick = () => { if (busy) return; if (convo.messages.length && !confirm("Start a new conversation? This one stays in the notYves log on the Mac.")) return; convo = { session: "", messages: [] }; save(); render(); };
$("form").onsubmit = e => { e.preventDefault(); const q = $("q").value; $("q").value = ""; grow(); ask(q); };
$("q").addEventListener("input", grow);
$("q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && matchMedia("(pointer:fine)").matches) { e.preventDefault(); $("form").requestSubmit(); } });

render(); health();
if (!cfg.url) openSettings();
</script>
</body>
</html>
