<style>
:root{--bg:#eef1f3;--panel:#f8fafb;--ink:#17212b;--muted:#56636f;--rule:#cfd6dc;--accent:#a8650a;--rust:#b4480e;
  --display:"Fraunces",Georgia,serif;--body:"Plus Jakarta Sans",system-ui,"Segoe UI",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12171c;--panel:#1a2128;--ink:#e3e8ec;--muted:#9aa6b1;--rule:#2d3740;--accent:#f2b84b;--rust:#ff7a3d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171c;--panel:#1a2128;--ink:#e3e8ec;--muted:#9aa6b1;--rule:#2d3740;--accent:#f2b84b;--rust:#ff7a3d;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);min-height:100vh;display:grid;place-items:center;padding:16px}
form{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:22px;display:grid;gap:12px}
h1{font:600 22px var(--display);margin:0}
p{margin:0;color:var(--muted);font-size:14px}
input,button{font:inherit;padding:8px 10px;border-radius:4px;border:1px solid var(--rule);background:var(--bg);color:var(--ink)}
button{cursor:pointer;border-color:var(--accent);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#msg{min-height:1.4em;color:var(--rust);font-size:14px}
</style></head><body>
<form id="f" autocomplete="off">
  <h1>Private page</h1>
  <p>Enter the password to open it. Decryption happens in your browser.</p>
  <label for="pw" style="font-size:14px;color:var(--muted)">Password</label>
  <input id="pw" type="password" autocomplete="current-password" autofocus required>
  <button id="go" type="submit">Open</button>
  <div id="msg" role="status"></div>
</form>
